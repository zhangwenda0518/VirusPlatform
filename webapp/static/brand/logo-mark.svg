<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="植物病毒分析平台">
  <!-- 徽标：二十面体衣壳（六边形）＋叶片＋一枚琥珀色刺突。
       配色取自 app.css 的 green-* 色阶；底色透明，
       浅色与深色主题下都可直接使用。
       注意：XML 注释内不能出现连续两个连字符，故此处不写 CSS 变量全名。 -->
  <defs>
    <linearGradient id="lgRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#239457"/>
      <stop offset="1" stop-color="#0b3b26"/>
    </linearGradient>
    <linearGradient id="lgLeaf" x1="0" y1="1" x2="0.35" y2="0">
      <stop offset="0" stop-color="#0b3b26"/>
      <stop offset="0.55" stop-color="#1a7a49"/>
      <stop offset="1" stop-color="#2aa15f"/>
    </linearGradient>
  </defs>

  <!-- ① 刺突（画在衣壳之下，露出半圈形成"刺"的观感） -->
  <g fill="#1a7a49">
    <circle cx="128" cy="16"  r="11"/>
    <circle cx="225" cy="72"  r="11"/>
    <circle cx="225" cy="184" r="11"/>
    <circle cx="128" cy="240" r="11"/>
    <circle cx="31"  cy="184" r="11"/>
    <circle cx="31"  cy="72"  r="11"/>
  </g>
  <!-- 右下那枚改用琥珀色：全图唯一暖色，作为"病毒"的视觉落点 -->
  <circle cx="225" cy="184" r="11" fill="#a3651d"/>

  <!-- ② 衣壳轮廓（小尺寸下不画分面线：512px 以下只会变成噪点） -->
  <polygon points="128,24 218,76 218,180 128,232 38,180 38,76"
           fill="#239457" fill-opacity="0.10"
           stroke="url(#lgRing)" stroke-width="9" stroke-linejoin="round"/>

  <!-- ③ 叶片 -->
  <path d="M128,196 C 78,168 78,90 128,62 C 178,90 178,168 128,196 Z"
        fill="url(#lgLeaf)"/>
  <!-- 主脉 -->
  <path d="M128,190 L128,68" stroke="#07271a" stroke-opacity="0.45"
        stroke-width="5" stroke-linecap="round"/>
  <!-- 侧脉：四对。叶片边界为 |x-128| = 150*t*(1-t)（最宽 37.5），
       终点都压在半宽之内，避免出现"毛刺" -->
  <g stroke="#07271a" stroke-opacity="0.32" stroke-width="3"
     stroke-linecap="round" fill="none">
    <path d="M128,109 C 133,104 140,99 145,95"/>
    <path d="M128,109 C 123,104 116,99 111,95"/>
    <path d="M128,129 C 136,124 149,118 158,115"/>
    <path d="M128,129 C 120,124 107,118 98,115"/>
    <path d="M128,149 C 136,144 150,139 159,135"/>
    <path d="M128,149 C 120,144 106,139 97,135"/>
    <path d="M128,167 C 133,163 140,159 145,157"/>
    <path d="M128,167 C 123,163 116,159 111,157"/>
  </g>
  <!-- 叶面高光（贴左缘内侧） -->
  <path d="M128,180 C 100,158 100,100 122,76" stroke="#e2f2e8"
        stroke-opacity="0.22" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
